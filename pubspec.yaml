name: version_assist
description: A CLI for bumping Dart and Flutter package versions, setting build numbers, updating README badges and creating Git tags.
version: 1.4.0
repository: https://github.com/kuyazee/version_assist
issue_tracker: https://github.com/kuyazee/version_assist/issues
platforms:
  linux:
  macos:
  windows:

topics:
  - cli
  - versioning
  - build-tools

environment:
  sdk: ^3.5.0

dependencies:
  args: ^2.5.0
  cli_completion: '>=0.5.1 <0.7.0'
  mason_logger: ^0.3.0
  path: ^1.8.0
  pub_semver: ^2.1.4
  pub_updater: '>=0.5.0 <0.7.0'
  yaml: ^3.1.2

dev_dependencies:
  build_runner: ^2.4.12
  build_version: ^2.1.1
  coverage: ^1.9.0
  mocktail: ^1.0.4
  test: ^1.25.8
  very_good_analysis: ">=7.0.0 <12.0.0"

version_gen:
  path: lib/src/

executables:
  version_assist:
